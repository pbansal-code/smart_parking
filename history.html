<!DOCTYPE html>
<html>
<head>
    <title>My Bookings - Smart Parking</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body onload="loadBookingHistory()">

<!-- Animated Background Shapes -->
<div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
</div>

<div class="navbar">
    <span>🚗 Smart Parking System</span>
    <div class="nav-links">
        <a href="home.html" class="nav-link">Home</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="dashboard" id="history-container">
    <h2>My Booking History</h2>

    <!-- Search & Filter Bar -->
    <div class="search-filter-bar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by slot or date..." oninput="filterBookings()">
        </div>
        <div class="filter-group">
            <select id="statusFilter" onchange="filterBookings()">
                <option value="all">All Status</option>
                <option value="upcoming">Upcoming</option>
                <option value="past">Past</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <select id="slotFilter" onchange="filterBookings()">
                <option value="all">All Slots</option>
                <option value="A">Row A</option>
                <option value="B">Row B</option>
                <option value="C">Row C</option>
            </select>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards" id="summaryCards">
        <div class="summary-card">
            <span class="summary-icon">📅</span>
            <div class="summary-info">
                <div class="summary-value" id="totalBookings">0</div>
                <div class="summary-label">Total Bookings</div>
            </div>
        </div>
        <div class="summary-card">
            <span class="summary-icon">✅</span>
            <div class="summary-info">
                <div class="summary-value" id="upcomingCount">0</div>
                <div class="summary-label">Upcoming</div>
            </div>
        </div>
        <div class="summary-card">
            <span class="summary-icon">⏰</span>
            <div class="summary-info">
                <div class="summary-value" id="pastCount">0</div>
                <div class="summary-label">Past</div>
            </div>
        </div>
        <div class="summary-card">
            <span class="summary-icon">❌</span>
            <div class="summary-info">
                <div class="summary-value" id="cancelledCount">0</div>
                <div class="summary-label">Cancelled</div>
            </div>
        </div>
    </div>

    <!-- Booking Cards -->
    <div id="bookingList" class="booking-list"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">🅿️</div>
        <p>No bookings found.</p>
        <a href="book.html"><button>Book Your First Slot</button></a>
    </div>

    <a href="home.html" class="back-link">← Back to Home</a>
</div>

<!-- Toast Container -->
<div class="toast-container"></div>

</body>
</html>
